[project]
name = "ai-research-paper-explainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishwarajsinh Kher", email = "vishwarajsinh.kher100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.9",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-research-paper-explainer = "ai_research_paper_explainer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
