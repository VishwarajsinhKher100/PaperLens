[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishwarajsinh Kher", email = "vishwarajsinh.kher100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.8",
    "pydantic[email]>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.33",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
